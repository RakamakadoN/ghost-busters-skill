name: Package Ghost Busters for Skill Marketplaces

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "references/**"
      - "examples/**"
      - "README.md"
      - "CUSTOMIZE.md"
      - "LICENSE"
      - "package.json"
      - ".github/workflows/package-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build clean marketplace ZIP
        run: |
          zip -q -r ghost-busters-community-v1.5.zip \
            SKILL.md README.md CUSTOMIZE.md LICENSE package.json references examples \
            -x 'examples/private-hunter-workflow.yml' 'examples/hunter.live.example.json'
          unzip -Z1 ghost-busters-community-v1.5.zip | grep -qx 'SKILL.md'
          unzip -Z1 ghost-busters-community-v1.5.zip | grep -qx 'references/ghost-hunter.cjs'
          unzip -Z1 ghost-busters-community-v1.5.zip | grep -qx 'references/lib/hunter.cjs'
          unzip -t ghost-busters-community-v1.5.zip | tail -n 1
      - name: Upload Agensi-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ghost-busters-community-v1.5-agensi
          path: ghost-busters-community-v1.5.zip
          retention-days: 30
          if-no-files-found: error
