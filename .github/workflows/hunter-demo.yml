name: Ghost Busters Autonomous Hunter (Synthetic Demo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-watch:
    name: Synthetic autonomous hunter smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate two observations using current synthetic timestamps
        run: node references/hunter-demo.cjs
      - name: Display synthetic report, not production alerts
        run: cat .ghost-hunter/synthetic-demo/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SYNTHETIC reports only
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-autonomous-hunter-demo
          path: |
            .ghost-hunter/synthetic-demo/report.json
            .ghost-hunter/synthetic-demo/report.md
          retention-days: 7
