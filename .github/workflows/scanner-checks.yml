name: Ghost Busters scanner checks
on:
  push:
    branches:
      - 'benchmark/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Regression suite
        run: npm test
      - name: Row-cap fixture benchmark
        run: node benchmark/row-cap-30.cjs --strict
      - name: Adversarial fixture benchmark
        run: node benchmark/adversarial-30.cjs --strict
